name: CI Pipeline

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: maktab_owner
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: maktab_ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U maktab_owner -d maktab_ci_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      ALEMBIC_DATABASE_URL: postgresql+asyncpg://maktab_owner:ci_test_password@localhost:5432/maktab_ci_db
      DATABASE_URL: postgresql+asyncpg://maktab_owner:ci_test_password@localhost:5432/maktab_ci_db
      MAKTAB_APP_PASSWORD: ci_maktab_app_password
      SECRET_KEY: ci_test_super_secret_key_for_github_actions_only
      DEFAULT_ADMIN_EMAIL: admin@maktab142.uz
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run pytest
        run: pytest tests/test_generator.py tests/test_generator_cpsat.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      - name: Run Vitest unit tests
        run: npm test

      - name: Build Next.js production app
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from .env.example for compose build
        run: cp .env.example .env

      - name: Build Docker Compose images
        run: docker compose build
