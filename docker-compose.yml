services:
  # ==========================================
  # PostgreSQL Database (Local / Internal)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: maktab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER .env faylida ko'rsatilishi shart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env faylida ko'rsatilishi shart}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB .env faylida ko'rsatilishi shart}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maktab_backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL .env faylida ko'rsatilishi shart}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL:?ALEMBIC_DATABASE_URL .env faylida ko'rsatilishi shart}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylida ko'rsatilishi shart}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}
      PROCESS_JOBS_EXTERNALLY: "true"
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Background Timetable Worker Service
  # ==========================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maktab_worker
    restart: unless-stopped
    command: python -m services.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL .env faylida ko'rsatilishi shart}
      ALEMBIC_DATABASE_URL: ${ALEMBIC_DATABASE_URL:?ALEMBIC_DATABASE_URL .env faylida ko'rsatilishi shart}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY .env faylida ko'rsatilishi shart}
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Next.js 14 Frontend Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    container_name: maktab_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
