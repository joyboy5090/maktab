version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database (Local Development)
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: maktab_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maktab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maktab_secret_123}
      POSTGRES_DB: ${POSTGRES_DB:-maktab_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maktab_user -d maktab_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # FastAPI Backend Service
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maktab_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://maktab_user:maktab_secret_123@postgres:5432/maktab_db}
      SECRET_KEY: ${SECRET_KEY:-maktab_super_secure_secret_key_change_in_production_2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 120
      REFRESH_TOKEN_EXPIRE_DAYS: 7
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # Next.js 14 Frontend Service
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maktab_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
